<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>竞彩足球</title>
</head>
<body style="margin:0;background:#0e1320;color:#e8edf6;font-family:sans-serif">
<p style="padding:20px">正在加载原版界面 + 周六全30场…</p>
<script>
Promise.all([
  fetch("https://cdn.jsdelivr.net/gh/sanxiao686-byte/jczq@68f5d9b61937b211d8aeb3e6e5521ace087bca95/index.html",{cache:"no-store"}).then(r=>r.text()),
  fetch("./today.json",{cache:"no-store"}).then(r=>r.json())
]).then(function(res){
  var html=res[0], data=res[1];
  var next=html.replace(/window\.DATA = [\s\S]*?;\nfunction /,"window.DATA = "+JSON.stringify(data)+";\nfunction ");
  if(next===html){ next=html.replace(/window\.DATA = [\s\S]*?;/,"window.DATA = "+JSON.stringify(data)+";"); }
  document.open(); document.write(next); document.close();
}).catch(function(e){
  document.body.innerHTML='<p style="padding:20px">加载失败。请打开 <a style="color:#4da3ff" href="./today.json">today.json</a> 查 30 场名单。</p>';
});
</script>
</body></html>
