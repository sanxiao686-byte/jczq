<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>竞彩足球 · 个人数据台</title>
<style>
:root{
  --bg:#0e1320; --bg2:#131a2a; --card:#182136; --card2:#1e2940;
  --line:#26324d; --txt:#e8edf6; --muted:#8b98b5; --dim:#5c6884;
  --red:#ff5a5f; --green:#2ec27e; --blue:#4da3ff; --gold:#f5b942;
}
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; font-size:14px; line-height:1.5}
header{position:sticky; top:0; z-index:50; background:linear-gradient(180deg,#141b2e,#101727); border-bottom:1px solid var(--line); padding:12px 20px 0}
.top{display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding-bottom:10px}
.brand{display:flex; align-items:center; gap:10px}
.brand .logo{width:34px; height:34px; border-radius:8px; background:linear-gradient(135deg,#ff5a5f,#f5b942); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; color:#fff}
.brand h1{font-size:17px; font-weight:700}
.brand .sub{font-size:11px; color:var(--muted); font-weight:400}
.top .meta{margin-left:auto; font-size:12px; color:var(--muted); text-align:right}
.top .meta b{color:var(--gold)}
nav{display:flex; gap:4px}
nav button{background:none; border:none; color:var(--muted); font-size:14px; padding:10px 18px; cursor:pointer; border-bottom:2px solid transparent; font-weight:600}
nav button.active{color:var(--txt); border-bottom-color:var(--gold)}
.wrap{max-width:1080px; margin:0 auto; padding:16px 16px 70px}
.view{display:none}
.view.active{display:block}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-bottom:14px}
.legend .dot{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:5px; vertical-align:middle}
/* match card */
.match{background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:14px; overflow:hidden}
.match-head{display:flex; align-items:center; gap:12px; padding:12px 16px; cursor:pointer; flex-wrap:wrap}
.match-head .no{min-width:58px}
.match-head .no .tag{display:inline-block; background:#23314f; color:#9fb2d8; font-size:11px; padding:2px 7px; border-radius:5px; font-weight:600}
.match-head .no .dt{font-size:11px; color:var(--muted); margin-top:3px}
.match-head .league{font-size:12px; color:var(--muted); min-width:74px}
.teams{flex:1; min-width:220px; display:flex; align-items:center; justify-content:center; gap:12px; font-size:16px; font-weight:600}
.teams .t{text-align:center; line-height:1.25}
.teams .t .n{display:block}
.teams .t .rq{font-size:11px; font-weight:600; padding:0 4px; border-radius:3px}
.rq-host{background:rgba(255,90,95,.15); color:var(--red)}
.rq-away{background:rgba(46,194,126,.15); color:var(--green)}
.teams .vs{color:var(--dim); font-size:12px; font-weight:500}
.odds-quick{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.odds-2row{display:flex; flex-direction:column; gap:5px}
.odds-2row .orow{display:flex; gap:6px; justify-content:flex-end}
.odds-2row .orow .qcell{min-width:52px; padding:5px 8px}
.odds-2row .orow .rq-tag{min-width:22px; text-align:center; font-size:11px; color:var(--gold); font-weight:700; align-self:center; background:#23314f; border-radius:4px; padding:3px 0}
.dg-tag{display:inline-block; font-size:10px; color:#141b2e; background:var(--gold); border-radius:3px; padding:0 4px; font-weight:700; align-self:center; line-height:1}
.crown-quick{display:flex; flex-direction:column; gap:3px; font-size:12px; min-width:150px}
.crown-quick .cq-row{display:flex; gap:5px; align-items:center; justify-content:flex-end; white-space:nowrap}
.crown-quick .cq-lab{color:var(--muted); font-size:11px; margin-right:2px}
.crown-quick .cq-win{color:var(--red)} .crown-quick .cq-draw{color:var(--green)} .crown-quick .cq-lose{color:var(--blue)}
.crown-quick .hl{color:var(--gold); font-weight:700}
.plays-area{padding:14px 16px; border-bottom:1px solid var(--line)}
.bsls-filter{display:flex; flex-direction:column; gap:6px; margin-bottom:8px}
.bsls-filter .fl-row{display:flex; gap:5px; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--muted)}
.bsls-filter button{background:var(--card2); border:1px solid var(--line); color:var(--muted); padding:2px 10px; border-radius:12px; cursor:pointer; font-size:12px}
.bsls-filter button.on{background:var(--gold); color:#141b2e; border-color:var(--gold)}
.qcell{text-align:center; background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:6px 10px; min-width:56px}
.qcell .l{font-size:10px; color:var(--muted); margin-bottom:2px}
.qcell .v{font-size:15px; font-weight:700}
.qcell .v.win{color:var(--red)} .qcell .v.draw{color:var(--green)} .qcell .v.lose{color:var(--blue)}
.arrow{color:var(--dim); font-size:16px; margin-left:6px; transition:transform .15s}
.match.open .arrow{transform:rotate(180deg)}
.match-body{display:none; border-top:1px solid var(--line); background:var(--bg2)}
.match.open .match-body{display:block}
/* detail tabs */
.dtabs{display:flex; gap:2px; padding:0 16px; border-bottom:1px solid var(--line); background:#0d1322}
.dtabs button{background:none; border:none; color:var(--muted); font-size:13px; padding:10px 14px; cursor:pointer; border-bottom:2px solid transparent; font-weight:600}
.dtabs button.active{color:var(--gold); border-bottom-color:var(--gold)}
.tabpane{display:none; padding:16px}
.tabpane.active{display:block}
.sect{margin-bottom:20px}
.sect h3{font-size:13px; color:var(--gold); margin-bottom:10px; font-weight:700; letter-spacing:.5px; display:flex; align-items:center; gap:8px}
.sect h3::before{content:""; width:3px; height:14px; background:var(--gold); border-radius:2px}
table{width:100%; border-collapse:collapse; font-size:12.5px}
th,td{padding:6px 8px; text-align:center; border-bottom:1px solid var(--line)}
th{color:var(--muted); font-weight:600; font-size:11.5px; background:#141b2e}
tr:last-child td{border-bottom:none}
td.hl{color:var(--gold); font-weight:700}
td.r{color:var(--red)} td.g{color:var(--green)} td.b{color:var(--blue)}
.chip{display:inline-block; font-size:11px; padding:1px 8px; border-radius:20px; font-weight:600}
.chip.win{background:rgba(255,90,95,.15); color:var(--red)}
.chip.draw{background:rgba(46,194,126,.15); color:var(--green)}
.chip.lose{background:rgba(77,163,255,.15); color:var(--blue)}
.chip.big{background:rgba(255,90,95,.15); color:var(--red)}
.chip.small{background:rgba(46,194,126,.15); color:var(--green)}
.flow{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:13px}
.flow .stage{color:var(--muted); font-size:11px}
.flow .num{font-weight:700; font-size:16px}
.flow .hcap{color:var(--gold); font-weight:700; background:#23314f; padding:1px 8px; border-radius:5px}
.flow .arr{color:var(--dim)}
.pair{display:grid; grid-template-columns:1fr 1fr; gap:16px}
@media(max-width:720px){.pair{grid-template-columns:1fr}}
pre{background:#0d1322; border:1px solid var(--line); border-radius:8px; padding:12px; font-size:12px; line-height:1.6; color:#c6d0e4; white-space:pre-wrap; word-break:break-all; max-height:360px; overflow:auto; font-family:"SF Mono",Consolas,"Microsoft YaHei",monospace}
.muted{color:var(--muted); font-size:12px}
.summary-bar{background:#0d1322; border:1px solid var(--line); border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:10px; color:#c6d0e4}
.summary-bar b{color:var(--gold)}
.kv{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px}
.kv .k{background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:8px 10px}
.kv .k .lab{font-size:10.5px; color:var(--muted)}
.kv .k .vv{font-size:15px; font-weight:700; margin-top:2px}
.bf-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.bf-grid .cell{background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:12px; text-align:center}
.bf-grid .cell .nm{font-size:12px; color:var(--muted); margin-bottom:6px}
.bf-grid .cell .pr{font-size:20px; font-weight:800}
.bf-grid .cell .rt{font-size:13px; color:var(--gold); margin-top:2px}
.play-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(70px,1fr)); gap:6px}
.play-grid .p{background:var(--card2); border:1px solid var(--line); border-radius:6px; padding:6px 4px; text-align:center}
.play-grid .p .s{font-size:11px; color:var(--muted)}
.play-grid .p .o{font-size:14px; font-weight:700; color:var(--gold)}
.play-cols{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
@media(max-width:600px){.play-cols{grid-template-columns:1fr}}
.play-col h4{font-size:12px; margin-bottom:6px; padding-bottom:4px; border-bottom:1px solid var(--line)}
.play-col.h h4{color:var(--red)} .play-col.d h4{color:var(--green)} .play-col.a h4{color:var(--blue)}
.bqc-table{display:grid; grid-template-columns:44px repeat(3,1fr); gap:4px; max-width:420px}
.bqc-table .bh{font-size:11px; color:var(--muted); text-align:center}
.bqc-table .cell{background:var(--card2); border:1px solid var(--line); border-radius:6px; padding:6px 4px; text-align:center}
.bqc-table .cell .s{font-size:11px; color:var(--muted)}
.bqc-table .cell .o{font-size:14px; font-weight:700; color:var(--gold)}
.empty{padding:40px; text-align:center; color:var(--muted)}
.lfilter{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.lfilter button{background:var(--card2); border:1px solid var(--line); color:var(--muted); padding:5px 14px; border-radius:20px; cursor:pointer; font-size:12.5px; font-weight:600}
.lfilter button.active{background:var(--gold); color:#141b2e; border-color:var(--gold)}
/* review */
.rv-card{background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:16px; overflow:hidden}
.rv-head{padding:12px 16px; display:flex; align-items:center; gap:12px; cursor:pointer; flex-wrap:wrap}
.rv-head .d{font-weight:700; color:var(--gold)}
.rv-head .t{flex:1; min-width:200px}
.rv-head .badge{font-size:11px; padding:2px 8px; border-radius:5px; background:#23314f; color:#9fb2d8}
.rv-body{display:none; border-top:1px solid var(--line); padding:16px; background:var(--bg2)}
.rv-card.open .rv-body{display:block}
.total-bar{font-size:15px; font-weight:700; color:var(--gold); padding:8px 0}
.md{font-size:13px; line-height:1.7; white-space:pre-wrap; word-break:break-word}
.md h1,.md h2,.md h3{color:var(--gold); margin:14px 0 6px; font-size:15px}
.md h1{font-size:17px}
.md table{display:block; overflow-x:auto; margin:8px 0}
.md strong{color:var(--gold)}
@media(max-width:600px){.teams{font-size:14px}.qcell{min-width:48px;padding:5px 6px}.qcell .v{font-size:13px}}
/* betslip 过关计算器 */
.betslip{position:fixed; left:0; right:0; bottom:0; z-index:100; background:#0d1322; border-top:2px solid var(--gold); padding:10px 16px; box-shadow:0 -4px 20px rgba(0,0,0,.45)}
.betslip .bs-head{display:flex; align-items:center; gap:14px; flex-wrap:wrap; font-size:13px}
.betslip .bs-head b{color:var(--gold)}
.betslip select,.betslip input{background:var(--card2); border:1px solid var(--line); color:var(--txt); border-radius:6px; padding:4px 8px; font-size:13px}
.betslip input{width:64px}
.betslip .bs-list{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}
.betslip .bs-item{background:var(--card2); border:1px solid var(--gold); border-radius:6px; padding:4px 8px; font-size:12px; cursor:pointer; line-height:1.4}
.betslip .bs-item .x{color:var(--red); margin-left:6px; font-weight:700}
.betslip .bs-win{color:var(--red); font-size:16px}
.p.sel,.qcell.sel{outline:2px solid var(--gold); background:#2a3550}
.qcell{cursor:pointer}
body.has-slip{padding-bottom:110px}
</style>
</head>

<header>
  <div class="top">

  <div id="view-review" class="view">

    <div id="rv-app"></div>
  </div>
</div>

let bslsFilterState = {};
function calcStats(rows, team){
  let win=0, draw=0, lose=0, gf=0, ga=0, played=0;
  for(const r of rows){
    const s = (r.score||'').trim();
    if(!s || s==='VS' || !s.includes(':')) continue;
    const parts = s.split(':');
    const h = parseInt(parts[0],10), a = parseInt(parts[1],10);
    if(isNaN(h) || isNaN(a)) continue;
    let tg, og;
    if(r.home === team){ tg=h; og=a; }
    else if(r.away === team){ tg=a; og=h; }
    else continue;
    if(tg>og) win++; else if(tg===og) draw++; else lose++;
    gf+=tg; ga+=og; played++;
  }
  const rate = played ? Math.round(win/played*100) : 0;
  return {played, win, draw, lose, gf, ga, rate};
}
function bslsRow(r, homeTeam){
  const panlu = r.panlu==='赢'?'<span class="chip win">赢</span>':(r.panlu==='输'?'<span class="chip lose">输</span>':(r.panlu==='走'?'<span class="chip draw">走</span>':''));
  const eu = (r.eu||[]).join('/');
  const home = r.home === homeTeam ? `<b>${esc(r.home)}</b>` : esc(r.home);
  const away = r.away === homeTeam ? `<b>${esc(r.away)}</b>` : esc(r.away);
  return `<tr><td>${esc(r.time)}</td><td>${esc(r.league)}</td><td>${home}</td><td class="hl">${esc(r.score)}</td><td>${away}</td><td>${esc(r.half)}</td><td class="hl">${esc(r.asian)}</td><td>${panlu}</td><td class="muted">${esc(eu)}</td></tr>`;
}
function renderBslsTable(code, section, rows, title, homeTeam, statTeam){
  if(!rows || !rows.length) return '';
  const k = `${code}_${section}`;
  const st = bslsFilterState[k] || (bslsFilterState[k] = {league:'all', count:10});
  const isVs = r => { const s=(r.score||'').trim(); return !s || s==='VS' || !s.includes(':'); };
  const vsRows = rows.filter(isVs);
  const valid = rows.filter(r => !isVs(r));
  const leagues = [...new Set(valid.map(r=>r.league).filter(Boolean))];
  const filtered = st.league==='all' ? valid : valid.filter(r=>r.league===st.league);
  const shown = filtered.slice(0, st.count);
  const vsShown = st.league==='all' ? vsRows : vsRows.filter(r=>r.league===st.league);
  const leagueTabs = `<button class="${st.league==='all'?'on':''}" onclick="bslsFilter('${code}','${section}','league','all')">全部赛事</button>` +
    leagues.map(l=>`<button class="${st.league===l?'on':''}" onclick="bslsFilter('${code}','${section}','league','${l.replace(/'/g,"\\'")}')">${esc(l)}</button>`).join('');
  const countBtns = [6,10,20].map(c=>`<button class="${st.count===c?'on':''}" onclick="bslsFilter('${code}','${section}','count','${c}')">${c}场</button>`).join('');
  const body = [...vsShown.map(r=>bslsRow(r, homeTeam)), ...shown.map(r=>bslsRow(r, homeTeam))].join('');
  const s1 = calcStats(shown, statTeam);
  const statHtml = `<div class="summary-bar">近${s1.played}场：<b>${s1.win}胜 ${s1.draw}平 ${s1.lose}负</b> · 进${s1.gf}球 失${s1.ga}球 · 胜率${s1.rate}%</div>`;
  return `<div class="sect">
    <h3>${title}</h3>
    <div class="bsls-filter">
      <div class="fl-row">赛事：${leagueTabs}</div>
      <div class="fl-row">场次：${countBtns}</div>
    </div>
    <div id="bsls-${code}-${section}">
      <table><thead><tr><th>时间</th><th>赛事</th><th>主队</th><th>比分</th><th>客队</th><th>半场</th><th>亚盘终盘</th><th>盘路</th><th>平均欧赔</th></tr></thead><tbody>${body}</tbody></table>
      ${filtered.length>st.count?`<div class="muted" style="margin-top:4px">共${filtered.length}场，仅显示${st.count}场</div>`:''}
      ${statHtml}
    </div>
  </div>`;
}
function bslsFilter(code, section, key, value){
  const k = `${code}_${section}`;
  const st = bslsFilterState[k] || (bslsFilterState[k] = {league:'all', count:10});
  st[key] = value;
  const m = window.DATA.matches.find(x=>x.code===code);
  if(!m || !m.bsls) return;
  const titles = {home:`${m.home} 近期战绩`, away:`${m.away} 近期战绩`, h2h:'两队交锋'};
  const container = document.getElementById(`bsls-${code}-${section}`);
  if(container){
    const parent = container.closest('.sect');
    if(parent) parent.outerHTML = renderBslsTable(code, section, m.bsls[section].rows, titles[section], m.home, section==='away' ? m.away : m.home);
  }
}
function playsBlock(m){
  const plays = m.plays;
  if(!plays || (!plays.bf && !plays.zjq && !plays.bqc)) return '<div class="muted">暂无玩法数据（比分/总进球/半全场）</div>';
  const code = m.code;
  const dg = plays.dg || [];
  const dgTag = (k) => dg.includes(k) ? '<span class="dg-tag" style="margin-left:4px">单</span>' : '';
  let html = '<div class="muted" style="margin-bottom:10px">点击选项加入投注篮，底部自动算过关奖金</div>';
  if(plays.zjq){
    const items = Object.entries(plays.zjq).map(([k,v])=>{
      const label = k==='7' ? '7+球' : `${k}球`;
      return betP(code, 'zjq', k, label, v);
    }).join('');
    html += `<div class="sect"><h3>总进球${dgTag('jq')}</h3><div class="play-grid">${items}</div></div>`;
  }
  if(plays.bqc){
    const rows = ['胜','平','负'];
    const cell = (h, a) => {
      const key = h+a; const v = plays.bqc[key];
      return betP(code, 'bqc', key, `${h}${a}`, v || '');
    };
    html += `<div class="sect"><h3>半全场（行=半场 列=全场）${dgTag('bq')}</h3>
      <div class="bqc-table"><div class="bh"></div><div class="bh">胜</div><div class="bh">平</div><div class="bh">负</div>
      ${rows.map(h=>`<div class="bh">${h}</div>${rows.map(a=>cell(h,a)).join('')}`).join('')}
      </div></div>`;
  }
  if(plays.bf){
    const host=[], draw=[], away=[];
    for(const [k,v] of Object.entries(plays.bf)){
      if(k==='胜其它') host.push([k,v]);
      else if(k==='平其它') draw.push([k,v]);
      else if(k==='负其它') away.push([k,v]);
      else {
        const parts = k.split(':');
        if(parts.length===2){
          const h=+parts[0], a=+parts[1];
          if(h>a) host.push([k,v]); else if(h===a) draw.push([k,v]); else away.push([k,v]);
        }
      }
    }
    const col = (arr, cls, title) => `<div class="play-col ${cls}"><h4>${title}</h4><div class="play-grid">${arr.map(([k,v])=>betP(code, 'bf', k, k, v)).join('')}</div></div>`;
    html += `<div class="sect"><h3>比分${dgTag('bf')}</h3><div class="play-cols">${col(host,'h','主胜')}${col(draw,'d','平局')}${col(away,'a','客胜')}</div></div>`;
  }
  return html;
}

function crownQuick(m){
  const parts = [];
  const hg = m.odds && m.odds.eu && m.odds.eu.hg;
  if(hg){
    const [w,d,l] = parse3(hg);
    if(w) parts.push(`<div class="cq-row"><span class="cq-lab">皇冠欧赔</span><span class="cq-win">${esc(w)}</span><span class="cq-draw">${esc(d)}</span><span class="cq-lose">${esc(l)}</span></div>`);
  }
  const asian = m.crown && m.crown.asian;
  const al = asian && (asian.live || asian.init);
  if(al && (al.home || al.line_text || al.away)){
    parts.push(`<div class="cq-row"><span class="cq-lab">皇冠亚盘</span><span>${esc(al.home)}</span><span class="hl">${esc(al.line_text||al.line_num)}</span><span>${esc(al.away)}</span></div>`);
  }
  const ou = m.crown && m.crown.over_under;
  const ol = ou && (ou.live || ou.init);
  if(ol && (ol.over || ol.line_text || ol.under)){
    parts.push(`<div class="cq-row"><span class="cq-lab">大小球</span><span>${esc(ol.over)}</span><span class="hl">${esc(ol.line_text||ol.line_num)}</span><span>${esc(ol.under)}</span></div>`);
  }
  return parts.length ? `<div class="crown-quick">${parts.join('')}</div>` : '';
}
function matchCard(m, idx){
  const rq = m.rq;
  const rqNote = (rq!=null && rq!=='' && rq!==undefined) ? String(rq) : '';
  const dg = (m.plays && m.plays.dg) || [];
  const spfDG = dg.includes('spf');
  const rqDG = dg.includes('nspf');
  const rqText = (rq!=null && rq!=='' && rq!==undefined)
    ? (String(rq).startsWith('-') ? `让${rq}` : (String(rq).startsWith('+') ? `受让${String(rq).slice(1)}` : `平手${rq}`)) : '';
  const rqHost = rq!=null && String(rq).startsWith('-');
  const rqAway = rq!=null && String(rq).startsWith('+');

  let spfRow = '';
  if(m.spf){
    spfRow = betCell(m.code, 'spf', 'win', '主胜', m.spf.win, 'win')
           + betCell(m.code, 'spf', 'draw', '平', m.spf.draw, 'draw')
           + betCell(m.code, 'spf', 'lose', '客胜', m.spf.lose, 'lose');
  }
  let rqRow = '';
  if(m.rqspf){
    rqRow = betCell(m.code, 'rqspf', 'win', '让胜', m.rqspf.win, 'win')
          + betCell(m.code, 'rqspf', 'draw', '让平', m.rqspf.draw, 'draw')
          + betCell(m.code, 'rqspf', 'lose', '让负', m.rqspf.lose, 'lose');
  }

  const t1 = m.date ? `${m.date.slice(5)} ${m.time||''}` : (m.code||'');
  const league = m.league || '';

  const hasDetail = m.odds || m.crown || m.h2h || m.form || m.standings || m.bf || m.avg;

  // 赔率 pane
  let oddsPane = '';
  if(m.odds){
    oddsPane += `<div class="pair">
      <div class="sect"><h3>欧赔（各公司）</h3>${euTable(m.odds)}</div>
      <div class="sect"><h3>亚盘（各公司）</h3>${asianTable(m.odds)||'<div class="muted">无</div>'}</div>
    </div>`;
    oddsPane += `<div class="pair">
      ${kellyTable(m.odds)?`<div class="sect"><h3>凯利指数</h3>${kellyTable(m.odds)}</div>`:''}
      ${glTable(m.odds)?`<div class="sect"><h3>胜平负概率</h3>${glTable(m.odds)}</div>`:''}
    </div>`;
    if(dxqTable(m.odds)) oddsPane += `<div class="sect"><h3>大小球（各公司）</h3>${dxqTable(m.odds)}</div>`;
  }
  oddsPane += crownBlock(m.crown);
  if(!oddsPane) oddsPane = '<div class="muted">暂无赔率数据</div>';

  const bslsHtml = bslsBlock(m.bsls, m);
  const basePane = (bslsHtml || (standingsBlock(m.standings) + h2hBlock(m.h2h) + formBlock(m.form) + avgBlock(m.avg))) + xgBlock(m);
  const bfPane = bfBlock(m.bf);
  const playPane = playsBlock(m);

  let body = '';
  if(m.plays || hasDetail){
    const tabs = hasDetail ? `<div class="dtabs">
        <button data-t="odds" class="active" onclick="dt(${idx},'odds')">赔率</button>
        <button data-t="base" onclick="dt(${idx},'base')">基本面</button>
        <button data-t="bf" onclick="dt(${idx},'bf')">必发</button>
      </div>
      <div class="tabpane active" id="m${idx}-odds">${oddsPane}</div>
      <div class="tabpane" id="m${idx}-base">${basePane}</div>
      <div class="tabpane" id="m${idx}-bf">${bfPane}</div>` : '';
    body = `<div class="match-body" id="mb${idx}">
      <div class="plays-area">${playPane}</div>
      ${tabs}
    </div>`;
  } else {
    body = `<div class="match-body"><div style="padding:16px" class="muted">暂无详情数据（${esc(m.home)} vs ${esc(m.away)}）</div></div>`;
  }

  return `<div class="match" id="m${idx}">
    <div class="match-head" onclick="toggleMatch(${idx})">
      <div class="no"><span class="tag">${esc(m.code||'—')}</span><div class="dt">${esc(t1)}</div></div>
      <div class="league">${esc(league)}</div>
      <div class="teams">
        <span class="t"><span class="n">${esc(m.home)}</span>${rqHost?`<span class="rq rq-host">${esc(rqText)}</span>`:''}</span>
        <span class="vs">VS</span>
        <span class="t"><span class="n">${esc(m.away)}</span>${rqAway?`<span class="rq rq-away">${esc(rqText)}</span>`:''}</span>
      </div>
      <div class="odds-2row">
        <div class="orow">${spfDG ? '<span class="dg-tag">单</span>' : ''}<span class="rq-tag">0</span>${spfRow}</div>
        <div class="orow">${rqDG ? '<span class="dg-tag">单</span>' : ''}<span class="rq-tag">${rqNote}</span>${rqRow}</div>
      </div>
      ${crownQuick(m)}
      <span class="arrow">▾</span>
    </div>
    ${body}
  </div>`;
}

/* ===== review page ===== */
function mdTable(rows){
  if(!rows || !rows.length) return '';
  const head = rows[0];
  const body = rows.slice(1);
  const thead = `<tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>`;
  const tbody = body.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('');
  return `<table><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
}
function reviewCard(r, idx){
  let body = '';
  if(r.results && r.results.length){
    const rows = [['场次','对阵','全场','半场'], ...r.results.map(x=>[x.code,x.match,x.full,x.half])];
    body += `<div class="sect"><h3>赛果核对</h3>${mdTable(rows)}</div>`;
  }
  if(r.summary && r.summary.length){
    body += `<div class="sect"><h3>命中总表</h3>${mdTable(r.summary)}</div>`;
  }
  if(r.raw){
    body += `<div class="sect"><h3>原文</h3><div class="md">${esc(r.raw)}</div></div>`;
  }
  return `<div class="rv-card" id="rv${idx}">
    <div class="rv-head" onclick="document.getElementById('rv${idx}').classList.toggle('open')">
      <span class="d">${esc(r.date||'')}</span>
      <span class="t">${esc(r.title||r.file||'')}</span>
      <span class="badge">复盘</span>
    </div>
    <div class="rv-body">${body}</div>
  </div>`;
}
function reportCard(r, idx){
  let body = '';
  if(r.ops && r.ops.length){
    const rows = [['场次','对阵','结论','注码'], ...r.ops.map(x=>[x.code,x.match,x.concl,x.bet])];
    body += `<div class="sect"><h3>总操作单</h3>${mdTable(rows)}${r.total?`<div class="total-bar">合计：${esc(r.total)}</div>`:''}</div>`;
  }
  if(r.raw){
    body += `<div class="sect"><h3>原文</h3><div class="md">${esc(r.raw)}</div></div>`;
  }
  return `<div class="rv-card" id="rp${idx}">
    <div class="rv-head" onclick="document.getElementById('rp${idx}').classList.toggle('open')">
      <span class="d">${esc(r.date||'')}</span>
      <span class="t">${esc(r.title||r.file||'')}</span>
      <span class="badge">推荐</span>
    </div>
    <div class="rv-body">${body}</div>
  </div>`;
}

/* ===== 过关计算器 ===== */
let betSlip = [];
function betKey(code, play, opt){ return `${code}|${play}|${opt}`; }
function toggleBet(el, code, play, opt, label, odds){
  const key = betKey(code, play, opt);
  const i = betSlip.findIndex(b=>b.key===key);
  if(i>=0){ betSlip.splice(i,1); el.classList.remove('sel'); }
  else { betSlip.push({key, code, play, opt, label, odds}); el.classList.add('sel'); }
  renderSlip();
}
function removeBet(key){
  betSlip = betSlip.filter(b=>b.key!==key);
  const el = document.querySelector(`[data-key="${key}"]`);
  if(el) el.classList.remove('sel');
  renderSlip();
}
function clearSlip(){
  betSlip = [];
  document.querySelectorAll('.sel').forEach(e=>e.classList.remove('sel'));
  renderSlip();
}
function renderSlip(){
  const wrap = document.getElementById('betslip');
  const list = document.getElementById('bs-list');
  document.getElementById('bs-count').textContent = betSlip.length;
  if(betSlip.length===0){ wrap.style.display='none'; document.body.classList.remove('has-slip'); return; }
  wrap.style.display='block';
  document.body.classList.add('has-slip');
  list.innerHTML = betSlip.map(b=>{
    const m = window.DATA.matches.find(x=>x.code===b.code);
    const mm = m ? `${esc(m.home)} vs ${esc(m.away)}` : esc(b.code);
    return `<span class="bs-item" onclick="removeBet('${b.key}')">${mm} · ${esc(b.label)} <b style="color:var(--gold)">${esc(b.odds)}</b><span class="x">×</span></span>`;
  }).join('');
  const mul = parseInt(document.getElementById('bs-mul').value) || 1;
  const mode = document.getElementById('bs-mode').value;
  let win = 0;
  if(mode==='single'){
    win = betSlip.reduce((s,b)=>s + 2*parseFloat(b.odds), 0) * mul;
  } else {
    const prod = betSlip.reduce((s,b)=>s*parseFloat(b.odds), 1);
    win = 2 * prod * mul;
  }
  document.getElementById('bs-win').textContent = '¥' + win.toFixed(2);
}
function betCell(code, play, opt, label, odds, colorCls){
  if(!odds) return '';
  const key = betKey(code, play, opt);
  return `<div class="qcell" data-key="${key}" onclick="toggleBet(this,'${code}','${play}','${opt}','${label}','${odds}')"><div class="l">${label}</div><div class="v ${colorCls}">${esc(odds)}</div></div>`;
}
function betP(code, play, opt, label, odds){
  if(!odds) return '';
  const key = betKey(code, play, opt);
  return `<div class="p" data-key="${key}" onclick="toggleBet(this,'${code}','${play}','${opt}','${label}','${odds}')"><div class="s">${label}</div><div class="o">${esc(odds)}</div></div>`;
}

/* ===== render ===== */
let curLeague = 'all';
function filterLeague(l){ curLeague = l; render(); }
function render(){
  const d = window.DATA;
  document.getElementById('upd').textContent = d.generated_at || '';
  document.getElementById('cnt').textContent = `共 ${d.count} 场`;
  const app = document.getElementById('app');
  if(!d.matches || !d.matches.length){
    document.getElementById('league-filter').innerHTML = '';
    app.innerHTML = '<div class="empty">暂无赛程数据</div>';
  } else {
    const leagues = [...new Set(d.matches.map(m=>m.league||'其他').filter(Boolean))];
    document.getElementById('league-filter').innerHTML =
      `<button class="${curLeague==='all'?'active':''}" onclick="filterLeague('all')">全部</button>` +
      leagues.map(l=>`<button class="${curLeague===l?'active':''}" onclick="filterLeague('${l.replace(/'/g,"\\'")}')">${esc(l)}</button>`).join('');
    const list = d.matches.filter(m=>curLeague==='all' || (m.league||'其他')===curLeague);
    app.innerHTML = list.map((m,i)=>matchCard(m,i)).join('');
  }
  // review
  const rv = document.getElementById('rv-app');
  let rvHtml = '';
  if(d.reports && d.reports.length){
    rvHtml += `<div class="sect"><h3>每日推荐</h3></div>` + d.reports.map((r,i)=>reportCard(r,i)).join('');
  }
  if(d.reviews && d.reviews.length){
    rvHtml += `<div class="sect"><h3>每日复盘</h3></div>` + d.reviews.map((r,i)=>reviewCard(r,i)).join('');
  }
  rv.innerHTML = rvHtml || '<div class="empty">暂无复盘/推荐数据</div>';
}

render();
</script>
<div id="betslip" class="betslip" style="display:none">
  <div class="bs-head">
    <span>已选 <b id="bs-count">0</b> 场</span>
    <span>过关：<select id="bs-mode" onchange="renderSlip()"><option value="n1">N串1（全中）</option><option value="single">单关（单注）</option></select></span>
    <span>倍数：<input id="bs-mul" type="number" min="1" value="1" oninput="renderSlip()"></span>
    <span>最高奖金：<b id="bs-win" class="bs-win">¥0.00</b></span>
    <button style="background:var(--red);color:#fff;border:none;border-radius:6px;padding:5px 12px;cursor:pointer" onclick="clearSlip()">清空</button>
  </div>
  <div id="bs-list" class="bs-list"></div>
</div>
</body>
</html>
